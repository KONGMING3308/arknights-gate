<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>这不是我的干员 v1.0</title>
    <meta name="description" content="明日方舟同人网页游戏：罗德岛入境口岸审查官" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      用途：配合 404.html 还原 SPA 路由。
      GitHub Pages 遇到子路由会走 404.html，那里把路径藏进 ?/xxx，
      这里把它还原成真实路径，让 React Router 正确识别。
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body class="bg-ink-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

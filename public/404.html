<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>罗德岛入境审查</title>
    <!--
      用途：GitHub Pages 的 SPA 兜底页。
      直接访问 /arknights-gate/review 这类子路由时，GitHub 返回 404，
      这里把路径转成查询串后跳回首页，由 index.html 里的脚本还原成真实路径。
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
